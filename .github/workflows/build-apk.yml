name: Build Notto APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/notto-release.jks \
            -storepass notto1234 \
            -keypass notto1234 \
            -alias notto \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Notto,O=Notto,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Zipalign, Re-sign (v1+v2+v3) and Verify APK
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/34."* | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | head -n 1)
          fi
          echo "Using build-tools: $BUILD_TOOLS"
          "$BUILD_TOOLS/zipalign" -p -f -v 4 \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/Notto-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks app/notto-release.jks \
            --ks-pass pass:notto1234 \
            --key-pass pass:notto1234 \
            --ks-key-alias notto \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/release/Notto-v1.0.3.apk \
            app/build/outputs/apk/release/Notto-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/Notto-v1.0.3.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: notto-release-apk
          path: app/build/outputs/apk/release/Notto-v1.0.3.apk
